name: Insurance Data Engineering Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  data-pipeline:
    name: Run ETL Pipeline and Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full ETL pipeline
        run: python src/07_pipeline_orchestration.py

      - name: Run incremental ETL
        run: python src/08_incremental_etl.py

      - name: Run automated pipeline tests
        run: python src/09_pipeline_tests.py

      - name: Upload pipeline test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test-results
          path: outputs/tests/
          if-no-files-found: warn

      - name: Upload monitoring outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-monitoring-results
          path: outputs/monitoring/
          if-no-files-found: warn

      - name: Upload incremental ETL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-etl-results
          path: outputs/incremental/
          if-no-files-found: warn
